openapi: 3.1.0
info:
  title: Autocodex Local API
  version: v1
  description: Local API for run status, events, and artifacts.
servers:
  - url: http://127.0.0.1:7788
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status: { type: string }
                  time: { type: string, format: date-time }
  /runs:
    get:
      summary: List runs
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunSummary'
  /runs/{run_id}:
    get:
      summary: Get run detail
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '404':
          description: Not found
  /runs/{run_id}/control:
    get:
      summary: Get run control status
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run control status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunControlStatus'
        '404':
          description: Not found
    post:
      summary: Request run control action
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunControlRequest'
      responses:
        '202':
          description: Run control accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunControlResponse'
        '400':
          description: Invalid request
        '404':
          description: Not found
  /runs/{run_id}/events:
    get:
      summary: List run events
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunEvent'
  /runs/{run_id}/artifacts:
    get:
      summary: List run artifacts
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtifactSummary'
  /runs/{run_id}/snapshots:
    get:
      summary: List run snapshots
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotSummary'
    post:
      summary: Create run snapshot
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreateRequest'
      responses:
        '201':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDetail'
        '400':
          description: Invalid request
        '404':
          description: Not found
  /runs/{run_id}/snapshots/{snapshot_id}:
    get:
      summary: Get run snapshot detail
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Snapshot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotDetail'
        '404':
          description: Not found
  /artifacts/{artifact_id}:
    get:
      summary: Get artifact detail
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactDetail'
        '404':
          description: Not found
  /memory:
    get:
      summary: List memory docs
      responses:
        '200':
          description: Memory docs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryDocSummary'
  /memory/{doc_name}:
    get:
      summary: Get memory doc
      parameters:
        - name: doc_name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Memory doc detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDocDetail'
        '404':
          description: Not found
components:
  schemas:
    RunSummary:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, canceled] }
        current_phase: { type: string, enum: [ideate, plan, implement, review, test] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        iterations: { type: integer }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          additionalProperties: false
          properties:
            config_hash: { type: string }
            events_count: { type: integer }
            artifacts_count: { type: integer }
            last_error: { type: string, nullable: true }
    RunEvent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        run_id: { type: string }
        ts: { type: string, format: date-time }
        type: { type: string }
        phase: { type: string, enum: [ideate, plan, implement, review, test] }
        message: { type: string }
        metadata: { type: object }
    ArtifactSummary:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        run_id: { type: string }
        name: { type: string }
        type: { type: string }
        path: { type: string }
        created_at: { type: string, format: date-time }
    ArtifactDetail:
      allOf:
        - $ref: '#/components/schemas/ArtifactSummary'
        - type: object
          additionalProperties: false
          properties:
            size_bytes: { type: integer }
            checksum: { type: string }
            content_url: { type: string }
    RunControlRequest:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [resume, stop, cancel, kill] }
        reason: { type: string }
        dry_run: { type: boolean }
    RunControlResponse:
      type: object
      additionalProperties: false
      properties:
        run_id: { type: string }
        action: { type: string, enum: [resume, stop, cancel, kill] }
        accepted: { type: boolean }
        status: { type: string, enum: [queued, running, completed, failed, canceled] }
        message: { type: string }
    RunControlStatus:
      type: object
      additionalProperties: false
      properties:
        run_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, canceled] }
        last_action: { type: string, enum: [resume, stop, cancel, kill], nullable: true }
        last_action_at: { type: string, format: date-time, nullable: true }
    SnapshotCreateRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string }
        include_events: { type: boolean, default: true }
        include_artifacts: { type: boolean, default: true }
        include_memory: { type: boolean, default: true }
        max_bytes: { type: integer, minimum: 0 }
    SnapshotSummary:
      type: object
      additionalProperties: false
      properties:
        id: { type: string }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        reason: { type: string }
        size_bytes: { type: integer }
        content_url: { type: string }
    SnapshotDetail:
      allOf:
        - $ref: '#/components/schemas/SnapshotSummary'
        - type: object
          additionalProperties: false
          properties:
            manifest:
              type: object
              additionalProperties: false
              properties:
                events: { type: integer }
                artifacts: { type: integer }
                memory_docs: { type: integer }
                bytes: { type: integer }
    MemoryDocSummary:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        path: { type: string }
        updated_at: { type: string, format: date-time }
        size_bytes: { type: integer }
    MemoryDocDetail:
      allOf:
        - $ref: '#/components/schemas/MemoryDocSummary'
        - type: object
          additionalProperties: false
          properties:
            content: { type: string }
