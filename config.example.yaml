version: v1
mode: yolo

codex:
  cli_path: codex
  model: gpt-5.2-codex
  reasoning_effort: xhigh
  timeout_seconds: 900
  extra_args: []
  # approval/sandbox are ignored when mode: yolo (yolo uses --yolo)
  approval_policy: on-request
  sandbox_mode: workspace-write

paths:
  state_dir: .autocodex
  memory_dir: memory
  logs_dir: logs
  artifacts_dir: artifacts
  runs_dir: runs

skills:
  paths:
    - /Users/fatih/dev/oodaris_codex_skills/skills
  allowlist: []
  denylist: []

plugins:
  enabled: true
  paths:
    - plugins
  timeout_seconds: 60

hub:
  enabled: false
  # If enabled and workspaces is empty, the current repo is used as a default workspace.
  workspaces:
    - id: demo
      name: Demo repo
      root: /path/to/repo
      config_path: autocodex.yaml

api:
  enabled: true
  host: 127.0.0.1
  port: 7788
  base_path: /

ui:
  enabled: false
  origin: http://localhost:5173

beads:
  enabled: true
  auto_create: true
  auto_update: true

logging:
  level: info
  format: json

auth:
  enabled: false
  token_env: AUTOCODEX_API_TOKEN
  tokens:
    - "replace-with-secret-token"

loop:
  mode: bounded
  max_iterations: 50
  phases:
    - ideate
    - plan
    - implement
    - review
    - test
  stop_conditions:
    max_duration_seconds: 0
    max_idle_seconds: 0
    max_consecutive_failures: 0
    max_heartbeat_seconds: 180
  feedback:
    mode: off
    sources:
      - memory
      - events
      - artifacts
    max_artifacts: 20
    max_events: 200
    max_bytes: 0
    memory_glob: "*.md"

autonomy:
  enabled: false
  spec_template: docs/specs/TEMPLATE.md
  plan_template: docs/plans/TEMPLATE.md
  tasks_schema: docs/contracts/autonomy-tasks.schema.json
  actions_schema: docs/contracts/autonomy-actions.schema.json
  tasks_output_template: docs/plans/%s-tasks.json
  stop_conditions:
    max_fix_attempts: 3
    max_beads: 0
    stop_on_gate_failure: true
